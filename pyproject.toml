[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drdvi-enrc"
version = "0.1.0"
description = "DRDVI representations combined with ENRC non-redundant clustering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Enjing Zhou"}]
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.0",
  "Pillow>=9.0", "tqdm>=4.65", "matplotlib>=3.7", "PyYAML>=6.0",
  "clustpy>=0.0.2"
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

